<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="profileSetupPage" class="profile-setup hidden" aria-live="polite">
    <form id="profileForm" class="profile-card">
      <h2 id="profileTitle"></h2>
      <p id="profileLocalNote" class="profile-note"></p>

      <label id="profileNicknameLabel" for="profileNickname"></label>
      <input id="profileNickname" type="text" maxlength="24" autocomplete="nickname">

      <label id="profileAvatarLabel"></label>
      <div id="profileAvatarOptions" class="avatar-options"></div>

      <label id="profileBirthdayLabel" for="profileBirthday"></label>
      <input id="profileBirthday" type="date">

      <label id="profileGenderLabel" for="profileGender"></label>
      <select id="profileGender"></select>

      <label id="profileLanguageLabel" for="profileDefaultLanguage"></label>
      <select id="profileDefaultLanguage"></select>

      <label class="checkbox-row">
        <input id="profileSaveHistory" type="checkbox" checked>
        <span id="profileHistoryLabel"></span>
      </label>

      <p id="profileError" class="safety-message" role="alert"></p>
      <button id="profileSaveButton" class="primary-button" type="submit"></button>
    </form>
  </section>

  <main class="app-shell">
    <div class="top-controls">
      <div class="language-switcher" aria-label="Language selector">
        <label for="languageSelect" data-i18n="languageLabel"></label>
        <select id="languageSelect"></select>
      </div>
      <button id="profileEditButton" class="profile-edit-button" type="button"></button>
    </div>

    <section class="hero-card">
      <p class="eyebrow" data-i18n="eyebrow">Mystic Tarot</p>
      <h1 data-i18n="appTitle"></h1>
      <p class="subtitle" data-i18n="subtitle"></p>
      <p class="disclaimer" data-i18n="disclaimer">
        
      </p>
    </section>

    <nav class="step-indicator" aria-label="App steps">
      <span class="step-indicator-item active" data-step="input" id="stepInputLabel"></span>
      <span class="step-indicator-item" data-step="process" id="stepProcessLabel"></span>
      <span class="step-indicator-item" data-step="result" id="stepResultLabel"></span>
    </nav>

    <section class="step-page active" data-step="input">
    <section class="panel input-panel" aria-labelledby="question-title">
      <h2 id="question-title" data-i18n="questionTitle"></h2>
      <label for="questionInput" data-i18n="questionLabel"></label>
      <textarea id="questionInput" rows="4" data-i18n-placeholder="questionPlaceholder" placeholder=""></textarea>

      <label for="questionType" data-i18n="questionTypeLabel"></label>
      <select id="questionType"></select>

      <label for="spreadType" data-i18n="spreadLabel"></label>
      <select id="spreadType"></select>

      <button id="startButton" class="primary-button" data-i18n="startButton"></button>
      <p id="safetyMessage" class="safety-message" role="alert"></p>
    </section>
    </section>

    <section class="step-page" data-step="process">
    <section id="processSummary" class="panel process-summary">
      <h2 id="processTitle"></h2>
      <p id="questionSummary"></p>
      <button id="backToInputButton" class="secondary-button"></button>
    </section>

    <section id="shuffleArea" class="panel hidden" aria-live="polite">
      <h2 data-i18n="shuffleTitle"></h2>
      <div id="shuffleStage" class="shuffle-stage paused">
        <div class="mini-card card-a"></div>
        <div class="mini-card card-b"></div>
        <div class="mini-card card-c"></div>
        <div class="mini-card card-d"></div>
      </div>
      <p id="shufflePrompt"></p>
      <button id="shuffleActionButton" class="primary-button"></button>
    </section>
    </section>

    <section class="step-page" data-step="result">
    <section id="resultArea" class="panel hidden">
      <h2 data-i18n="resultTitle"></h2>
      <div id="cardsContainer" class="cards-container"></div>
    </section>

    <section id="readingArea" class="panel hidden">
      <h2 data-i18n="readingTitle"></h2>
      <div id="readingContainer"></div>
    </section>

    <section id="summaryArea" class="panel hidden">
      <h2 data-i18n="summaryTitle"></h2>
      <div id="summaryContainer"></div>
    </section>

    <div class="result-actions">
      <button id="backToProcessButton" class="secondary-button"></button>
      <button id="saveResultButton" class="secondary-button" type="button"></button>
      <button id="shareResultButton" class="secondary-button" type="button"></button>
      <button id="resetButton" class="secondary-button hidden" data-i18n="resetButton"></button>
    </div>
    </section>
  </main>

  <script src="storage-adapter.js"></script>
  <script src="locale-detector.js"></script>
  <script src="tarot-data.js"></script>
  <script src="i18n.js"></script>
  <script src="interpretation-bank.js"></script>
  <script src="reading-engine.js"></script>
  <script src="deep-summary-engine.js"></script>
  <script src="user-profile.js"></script>
  <script src="app-state.js"></script>
  <script src="script.js"></script>
</body>
</html>
