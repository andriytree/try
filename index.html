<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>塔罗牌占卜</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <div class="language-switcher" aria-label="Language selector">
      <label for="languageSelect" data-i18n="languageLabel">语言</label>
      <select id="languageSelect"></select>
    </div>

    <section class="hero-card">
      <p class="eyebrow" data-i18n="eyebrow">Mystic Tarot</p>
      <h1 data-i18n="appTitle">塔罗牌占卜</h1>
      <p class="subtitle" data-i18n="subtitle">一个用于娱乐和自我反思的塔罗体验</p>
      <p class="disclaimer" data-i18n="disclaimer">
        本工具仅供娱乐和自我反思，不构成医疗、法律、财务、心理治疗或人生重大决策建议。
      </p>
    </section>

    <section class="panel input-panel" aria-labelledby="question-title">
      <h2 id="question-title" data-i18n="questionTitle">提出你的问题</h2>
      <label for="questionInput" data-i18n="questionLabel">你想询问什么？</label>
      <textarea id="questionInput" rows="4" data-i18n-placeholder="questionPlaceholder" placeholder="例如：我现在应该如何看待这段关系？"></textarea>

      <label for="questionType" data-i18n="questionTypeLabel">问题类型</label>
      <select id="questionType"></select>

      <label for="spreadType" data-i18n="spreadLabel">牌阵选择</label>
      <select id="spreadType"></select>

      <button id="startButton" class="primary-button" data-i18n="startButton">开始占卜</button>
      <p id="safetyMessage" class="safety-message" role="alert"></p>
    </section>

    <section id="shuffleArea" class="panel hidden" aria-live="polite">
      <h2 data-i18n="shuffleTitle">洗牌</h2>
      <div id="shuffleStage" class="shuffle-stage paused">
        <div class="mini-card card-a"></div>
        <div class="mini-card card-b"></div>
        <div class="mini-card card-c"></div>
        <div class="mini-card card-d"></div>
      </div>
      <p id="shufflePrompt">问题已通过检查。请准备好后开始洗牌。</p>
      <button id="shuffleActionButton" class="primary-button">开始洗牌</button>
    </section>

    <section id="resultArea" class="panel hidden">
      <h2 data-i18n="resultTitle">抽牌结果</h2>
      <div id="cardsContainer" class="cards-container"></div>
    </section>

    <section id="readingArea" class="panel hidden">
      <h2 data-i18n="readingTitle">分层解读</h2>
      <div id="readingContainer"></div>
    </section>

    <section id="summaryArea" class="panel hidden">
      <h2 data-i18n="summaryTitle">整体总结</h2>
      <div id="summaryContainer"></div>
    </section>

    <button id="resetButton" class="secondary-button hidden" data-i18n="resetButton">重新占卜</button>
  </main>

  <script src="tarot-data.js"></script>
  <script src="i18n.js"></script>
  <script src="interpretation-bank.js"></script>
  <script src="reading-engine.js"></script>
  <script src="deep-summary-engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
